<header class="header">
  <div class="container">
    <div class="main-header">
      <div class="header-logo">
        <img src="/images/mountain-icon.svg" alt="mountain" class="logo" />
        <span class="company-name">{{ companyName }}</span>
      </div>
      <nav class="header-nav">
        @for (item of navigation; track item.link) {
          <a
            [routerLink]="item.link"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-link"
          >
            {{ item.label }}
          </a>
        }
      </nav>
      <div class="header-actions">
        <div class="cart-wrapper">
          <button
            id="cart-link"
            routerLink="/cart"
            routerLinkActive="cart-active"
            type="button"
            aria-label="Перейти в корзину"
            class="button-cart"
          >
            <fa-icon [icon]="faShoppingBasket" class="cart-icon"></fa-icon>
          </button>
        </div>
        <div class="logout">
          @if (authService.authState$ | async) {
            <button
              id="logout"
              routerLink="/login"
              (click)="logout()"
              type="button"
              aria-label="Выйти из системы"
              class="logout-btn"
            >
              <fa-icon [icon]="faSignOutAlt" />
            </button>
          }
        </div>
        <div class="container-toggle-theme">
          @let isDark = themeService.isDarkMode$ | async;
          <fa-icon [icon]="isDark ? faMoon : faSun" />
          <p-toggleswitch [ngModel]="isDark" (onChange)="toggleDarkMode($event)" />
          <p-selectbutton
            [options]="themeService.themes"
            [ngModel]="themeService.theme$ | async"
            optionLabel="name"
            (onChange)="themeService.changeTheme($event.value)"
          />
        </div>
      </div>
    </div>
    <div class="header-date">
      @if (widget === 'date') {
        <span>{{ currentDate | date }}</span>
      }
      @if (widget === 'clicker') {
        <div>
          <button
            id="decrement-btn"
            class="count-btns"
            (click)="count -= 1"
            [disabled]="count <= 0"
          >
            -
          </button>
          <span class="count">{{ count }}</span>
          <button id="increment-btn" class="count-btns" (click)="count += 1">+</button>
        </div>
      }
      <button (click)="toggleWidget()" id="show-date-btn" class="show-date-btn">
        {{ widget === 'clicker' ? 'Показать дату' : 'Показать кликер' }}
      </button>
    </div>
  </div>
</header>

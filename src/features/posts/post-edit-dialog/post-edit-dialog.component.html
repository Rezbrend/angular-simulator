<div class="edit-post">
  <form id="post-edit-form" [formGroup]="postEditForm" (ngSubmit)="saveChanges()">
    <label for="title">Title:</label>
    <input id="title" type="text" formControlName='title'>
    <label for="tags">Tags:</label>
    <input id="tags" type="text" formControlName='tags'>
    <label for="views">Views:</label>
    <input id="views" type="number" formControlName='views'>
    <button 
      pButton 
      label="Сохранить" 
      type="submit" 
      [disabled]="postEditForm.invalid || postEditForm.pending">
      Сохранить
    </button>
  </form>
</div>

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-content">
      <div class="auth-header">
        <span class="auth-badge">АВТОРИЗАЦИЯ</span>
        <h2 class="auth-title">Вход в аккаунт</h2>
      </div>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="username" class="form-label">Имя пользователя</label>
          <input id="username" type="text" formControlName="username" class="form-input"/>
        </div>
        <div class="form-group">
          <label for="password" class="form-label">Пароль</label>
          <input id="password" type="password" formControlName="password" class="form-input"/>
        </div>
        <button id="auth-btn" class="auth-btn" type="submit" [disabled]="form.invalid || isLoading">{{ isLoading ? 'Вход...' : 'Войти' }}</button>
      </form>
    </div>
    <div class="auth-sidebar">
      <div class="sidebar-brand">
        <span class="brand-dot"></span> АЙТИ-СИМУЛЯТОР
      </div>
      <h3 class="sidebar-title">Управляйте постами, пользователями и контентом в одном месте</h3>
      <p class="sidebar-desc">Тёмный интерфейс, быстрая навигация и привычная структура работы с данными</p>
    </div>
  </div>
</div>
